name: CI

on:
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      API_KEY: dummy_api_key
      CLIENT_CODE: dummy_client_code
      CLIENT_PIN: dummy_client_pin
      CLIENT_TOTP_PIN: dummy_totp_pin
      TELEGRAM_BOT_TOKEN: dummy_bot_token
      TELEGRAM_CHAT_ID: dummy_chat_id
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format:check

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
